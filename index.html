<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e2d6" />
    <title>InMap</title>
  </head>
  <body>
    <canvas id="map"></canvas>
    <canvas id="map3d" hidden></canvas>

    <header id="banner" class="top">
      <div id="nav-icon" class="nav-icon"></div>
      <div class="nav-text">
        <div id="nav-main"></div>
        <div id="nav-sub"></div>
      </div>
    </header>

    <div class="map-ctrl">
      <div class="seg seg-view">
        <button data-view="2d">2D</button>
        <button data-view="3d" class="on">3D</button>
      </div>
      <button id="btn-pmr" class="pmr-toggle" aria-pressed="false" title="Itinéraires accessibles : ascenseurs uniquement">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="1.8" fill="currentColor" stroke="none" />
          <path d="M11 7.5v6h5.5l2.5 5.5M11 10.5h5" />
          <path d="M8 10.8a5.6 5.6 0 1 0 7.6 7.4" />
        </svg>
        PMR
      </button>
      <div id="floor-chip" class="floor-chip"></div>
    </div>

    <div id="promo-toast" class="toast" hidden>
      <canvas width="88" height="88"></canvas>
      <div class="toast-text">
        <div class="toast-title"></div>
        <div class="toast-sub"></div>
      </div>
      <span class="toast-go">Y aller →</span>
    </div>

    <section class="panel">
      <button id="btn-search" class="search-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m20 20-4.5-4.5" /></svg>
        Boutique, toilettes, sortie…
      </button>

      <div class="row">
        <div class="seg">
          <button data-mode="demo" class="on">Démo</button>
          <button data-mode="real">Réel</button>
        </div>
        <button id="btn-view" class="ghost">Vue d'ensemble</button>
      </div>

      <div id="real-controls" class="row" hidden>
        <button id="btn-sensors" class="primary">Activer le guidage</button>
        <button id="btn-align" class="ghost" title="Tenez le téléphone à plat, orienté vers le haut du plan">Aligner ↑</button>
      </div>

      <div id="stats" class="stats"></div>
      <div id="hint" class="hint"></div>
    </section>

    <section id="search" class="sheet" hidden>
      <div class="sheet-head">
        <input id="search-input" type="search" placeholder="Boutique, toilettes, sortie…" autocomplete="off" enterkeyhint="search" />
        <button id="search-close" class="ghost">Fermer</button>
      </div>
      <div id="search-chips" class="chips"></div>
      <ul id="search-results" class="results"></ul>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
